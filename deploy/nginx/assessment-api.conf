# Include inside each assessment site's server block.
location /api/ {
    client_max_body_size 50m;
    proxy_pass https://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name gemini.lintsing.net;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;
    proxy_read_timeout 325s;
    proxy_send_timeout 325s;
    proxy_set_header Host gemini.lintsing.net;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering on;
    add_header Alt-Svc "clear" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}

location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header Alt-Svc "clear" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}

location ^~ /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Alt-Svc "clear" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
