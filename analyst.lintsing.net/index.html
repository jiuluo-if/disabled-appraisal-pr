<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能伤情鉴定助手</title>
    
    <!-- 1. 引入 Tailwind CSS (样式库) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. 引入 Babel (用于在浏览器中编译 JSX) -->
    <script src="https://unpkg.com/@babel/standalone@7.26.0/babel.min.js"></script>

    <!-- 页面全局样式 -->
    <style>
        body { background-color: #f8fafc; }
        /* 美化滚动条 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- 3. React 应用主逻辑 -->
    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'https://esm.sh/react@18.2.0';
        import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
        
        import { 
            Camera, Upload, FileText, Search, AlertTriangle, ChevronRight, 
            Activity, BookOpen, Home, X, CheckCircle, AlertCircle, Scale, MessageSquare, Trash2
        } from 'https://esm.sh/lucide-react@0.292.0';

        // ... 标准库数据保持不变 ...
        const STANDARD_DB = [
          {
            category: "5.1 颅脑、脊髓损伤",
            items: [
              { grade: "重伤一级", desc: "a)植物生存状态。\nb)四肢瘫（三肢以上肌力3级以下）。\nc)偏瘫、截瘫（肌力2级以下），伴大便、小便失禁。\nd)非肢体瘫的重度运动障碍（重度共济失调，肌张力增高，肌张力不全，震颤，舞蹈样理，手足徐动症）。\ne)重度智能减退或者精神障碍，日常生活完全不能自理。" },
              { grade: "重伤二级", desc: "a)头皮缺损面积累计75.0cm²以上。\nb)开放性颅骨骨折伴硬脑膜破裂。\nc)颅底骨折，伴脑脊液漏持续4周以上。\nd)脑挫裂伤；颅内出血；慢性颅内血肿；外伤性脑积水。\ne)外伤性脑梗死，伴神经系统症状和体征。\nf)脊髓损伤致颈髓或者腰骶髓功能障碍，或者胸髓功能障碍。" },
              { grade: "轻伤一级", desc: "a)头皮缺损面积累计24.0cm²以上。\nb)头皮撕脱伤面积累计50.0cm²以上。\nc)头皮创口或者瘢痕长度累计20.0cm以上。\nd)颅骨凹陷性或者粉碎性骨折。\ne)脑神经损伤引起相应神经功能障碍。" },
              { grade: "轻伤二级", desc: "a)头皮创口或者瘢痕长度累计8.0cm以上。\nb)头皮撕脱伤面积累计20.0cm²以上；头皮缺损面积累计10.0cm²以上。\nc)帽状腱膜下血肿或者骨膜下血肿。\nd)颅骨骨折。\ne)外伤性蛛网膜下腔出血。\nf)脑神经损伤引起相应神经功能障碍（轻度）。" },
              { grade: "轻微伤", desc: "a)头部外伤后伴有神经症状。\nb)头皮擦伤面积5.0cm²以上；头皮挫伤；头皮下血肿。\nc)头皮创口或者瘢痕。" }
            ]
          },
          {
            category: "5.2 面部、耳廓损伤",
            items: [
              { grade: "重伤一级", desc: "a)容貌毁损（重度）。" },
              { grade: "重伤二级", desc: "a)面部条状瘢痕（50%以上位于中心区），单条长度10.0cm以上，或者累计长度15.0cm以上。\nb)面部块状瘢痕（50%以上位于中心区），单块面积6.0cm²以上，或者累计面积10.0cm²以上。\nc)一眼球缺失或者萎缩。\nd)鼻、唇、耳等严重缺损或毁损。" },
              { grade: "轻伤一级", desc: "a)面部单个创口或者瘢痕长度6.0cm以上；多个创口或者瘢痕长度累计10.0cm以上。\nb)面部块状瘢痕，单块面积4.0cm²以上；多块面积累计7.0cm²以上。\nc)面部片状细小瘢痕或者明显色素异常，面积累计30.0cm²以上。\nd)眼睑缺失；鼻尖/鼻翼缺损；耳廓缺损；牙齿脱落或者牙折共4枚以上。" },
              { grade: "轻伤二级", desc: "a)面部单个创口或者瘢痕长度4.5cm以上；多个创口或者瘢痕长度累计6.0cm以上。\nb)面部块状瘢痕，单块面积3.0cm²以上；多块面积累计5.0cm²以上。\nc)面部片状细小瘢痕或者色素异常，面积累计8.0cm²以上。\nd)牙齿脱落或者牙折2枚以上。\ne)眶壁骨折（单纯眶内壁骨折除外）。" },
              { grade: "轻微伤", desc: "a)面部软组织创。\nb)面部损伤留有瘢痕或者色素改变。\nc)面部皮肤擦伤，面积2.0cm²以上；面部软组织挫伤；面部划伤4.0cm以上。" }
            ]
          },
          {
            category: "5.3 听器听力损伤",
            items: [
              { grade: "重伤一级", desc: "a)双耳听力障碍(≥91dB HL)。" },
              { grade: "重伤二级", desc: "a)一耳听力障碍(≥91dB HL)。\nb)一耳听力障碍(≥81dB HL)，另一耳听力障碍(≥41dB HL)。\nc)一耳听力障碍(≥81dB HL)，伴同侧前庭平衡功能障碍。\nd)双耳听力障碍(≥61dB HL)。" },
              { grade: "轻伤一级", desc: "a)双耳听力障碍(≥41dB HL)。\nb)双耳外耳道闭锁。" },
              { grade: "轻伤二级", desc: "a)外伤性鼓膜穿孔6周不能自行愈合。\nb)听骨骨折或者脱位；听骨链固定。\nc)一耳听力障碍(≥41dB HL)。\nd)一耳前庭平衡功能障碍，伴同侧听力障碍(≥25dB HL)。" },
              { grade: "轻微伤", desc: "a)外伤性鼓膜穿孔。\nb)鼓室积血。\nc)外伤后听力减退。" }
            ]
          },
          {
            category: "5.4 视器视力损伤",
            items: [
              { grade: "重伤一级", desc: "a)双眼盲目5级。\nb)双眼盲目4级，伴一侧眼球结构损伤。" },
              { grade: "重伤二级", desc: "a)一眼盲目4级。\nb)一眼盲目3级，另一眼低视力2级。\nc)双眼低视力2级。\nd)眼睑松弛、眼睑闭合不全等致严重影响容貌或功能。" },
              { grade: "轻伤一级", desc: "a)外伤性青光眼，经治疗难控制。\nb)一眼低视力2级。\nc)双眼低视力1级。\nd)眼球损伤引起瞳孔散大、变形等。" },
              { grade: "轻伤二级", desc: "a)眼球穿通伤或者眼球破裂伤；前房出血；晶状体脱位。\nb)视神经损伤。\nc)泪器损伤。\nd)一眼低视力1级。\ne)斜视；复视。" },
              { grade: "轻微伤", desc: "a)眼球损伤影响视力。" }
            ]
          },
          {
            category: "5.5 颈部损伤",
            items: [
              { grade: "重伤一级", desc: "a)颈部大血管破裂。\nb)咽喉部位严重损伤致呼吸、吞咽功能障碍。" },
              { grade: "重伤二级", desc: "a)甲状旁腺功能低下（重度）。\nb)甲状腺功能低下。\nc)咽喉、气管损伤。" },
              { grade: "轻伤一级", desc: "a)颈前三角区瘢痕面积累计30.0cm²以上。\nb)甲状旁腺功能低下（轻度）。" },
              { grade: "轻伤二级", desc: "a)颈前三角区瘢痕面积累计10.0cm²以上。\nb)颈部创口或者瘢痕长度累计6.0cm以上。\nc)甲状腺挫裂伤。\nd)咽、喉、气管、食管损伤。" },
              { grade: "轻微伤", desc: "a)颈部创口或者瘢痕长度1.0cm以上。\nb)颈部擦伤面积4.0cm²以上。\nc)颈部挫伤面积2.0cm²以上。" }
            ]
          },
          {
            category: "5.6 胸部损伤",
            items: [
              { grade: "重伤一级", desc: "a)心脏损伤，致心功能不全（心功能IV级）。\nb)肺损伤致一侧全肺切除或者双侧肺切除。" },
              { grade: "重伤二级", desc: "a)心脏损伤，致心功能不全（心功能III级）。\nb)肺破裂修补；肺叶切除。\nc)食管破裂/穿孔。\nd)肋骨骨折12根以上，或者肋骨骨折8根以上并伴有4处以上双处骨折（连枷胸）。" },
              { grade: "轻伤一级", desc: "a)心脏挫伤致心包积血。\nb)肋骨骨折6根以上。\nc)血胸、气胸、血气胸，伴一侧肺萎陷30%以上，或者双侧肺萎陷均在20%以上。" },
              { grade: "轻伤二级", desc: "a)胸部创口或者瘢痕长度累计20.0cm以上。\nb)肋骨骨折2处以上。\nc)胸骨骨折；锁骨骨折；肩胛骨骨折。\nd)胸腔积血；胸腔积气。" },
              { grade: "轻微伤", desc: "a)肋骨骨折；胸骨骨折。\nb)胸部损伤，致皮下气肿、血胸、气胸。" }
            ]
          },
          {
            category: "5.7 腹部损伤",
            items: [
              { grade: "重伤一级", desc: "a)胃、肠、胆道系统、肝、胰、脾、肾等器官严重损伤。" },
              { grade: "重伤二级", desc: "a)胃、肠、胆道、肾破裂。\nb)脾破裂；肝破裂。\nc)腹部损伤致腹膜炎、败血症。" },
              { grade: "轻伤一级", desc: "a)胃、肠、胆道、肝、胰、脾、肾、肾上腺等器官挫裂伤。\nb)腹部损伤致腹膜炎。" },
              { grade: "轻伤二级", desc: "a)腹部创口或者瘢痕长度累计15.0cm以上。\nb)胃、肠、胆道、肾、肾上腺挫伤。\nc)肝包膜下或者实质内出血；脾包膜下或者实质内出血。\nd)腹壁挫伤伴腹腔积血。" },
              { grade: "轻微伤", desc: "a)腹部创口或者瘢痕长度1.0cm以上。\nb)腹部挫伤。" }
            ]
          },
          {
            category: "5.9 脊柱、四肢损伤",
            items: [
              { grade: "重伤一级", desc: "a)二肢以上离断或者缺失(上肢腕关节以上、下肢踝关节以上)。\nb)二肢六大关节功能完全丧失。" },
              { grade: "重伤二级", desc: "a)四肢长骨开放性骨折，并发慢性骨髓炎；大关节强直、畸形。\nb)一肢离断或者缺失。\nc)一肢功能丧失50%以上。" },
              { grade: "轻伤一级", desc: "a)四肢长骨粉碎性骨折或者两处以上骨折。\nb)四肢长骨骨折累及关节面。\nc)骺板骨折。\nd)一肢功能丧失10%以上。\ne)髌骨粉碎性骨折；韧带断裂。" },
              { grade: "轻伤二级", desc: "a)四肢长骨骨折。\nb)大关节脱位。\nc)关节韧带部分撕裂。\nd)髌骨骨折；半月板损伤。\ne)肢体皮肤创口或者瘢痕长度累计10.0cm以上。" },
              { grade: "轻微伤", desc: "a)肢体皮肤擦伤、挫伤。\nb)皮肤创口或者瘢痕长度1.0cm以上。" }
            ]
          },
          {
            category: "5.10 手、足损伤",
            items: [
              { grade: "重伤一级", desc: "a)双手离断、缺失或者功能完全丧失。\nb)双足离断、缺失或者功能完全丧失。" },
              { grade: "重伤二级", desc: "a)双手缺失(或者丧失功能)50%以上。\nb)双足缺失(或者丧失功能)50%以上。\nc)一手缺失(或者丧失功能)70%以上。\nd)一足缺失(或者丧失功能)70%以上。" },
              { grade: "轻伤一级", desc: "a)手功能丧失累计达一手功能16%。\nb)一手拇指离断或者缺失未超过指间关节。\nc)一手除拇指外的示指和中指离断或者缺失。\nd)足功能丧失累计达一足功能16%。\ne)一足拇趾离断或者缺失未超过趾间关节。" },
              { grade: "轻伤二级", desc: "a)手功能丧失累计达一手功能4%。\nb)除拇指外的一个指节离断或者缺失。\nc)两节指骨线性骨折或者一节指骨粉碎性骨折。\nd)舟骨骨折、月骨脱位或者掌骨完全性骨折。\ne)足功能丧失累计达一足功能4%。\nf)2节趾骨骨折；一节趾骨粉碎性骨折。" },
              { grade: "轻微伤", desc: "a)手部擦伤、挫伤。\nb)手部创口或者瘢痕。\nc)足部擦伤、挫伤。\nd)足部创口或者瘢痕。\ne)指（趾）甲脱落。" }
            ]
          }
        ];

        // ==========================================
        //  配置区域 (请在此处配置您的 API)
        // ==========================================
        const PROXY_URL = "https://gemini.lintsing.net:3000/api/analyze"; 
        const DIRECT_API_KEY = ""; 
        // ==========================================

        // 主应用组件
        function SmartInjuryAssessment() {
          const [activeTab, setActiveTab] = useState('home'); 
          const [showDisclaimer, setShowDisclaimer] = useState(true);
          // 添加历史记录状态
          const [history, setHistory] = useState(() => {
            try {
              const saved = localStorage.getItem('injury_history');
              return saved ? JSON.parse(saved) : [];
            } catch (e) {
              return [];
            }
          });

          // 监听 history 变化并持久化
          useEffect(() => {
            localStorage.setItem('injury_history', JSON.stringify(history));
          }, [history]);

          // 保存新记录
          const addToHistory = (record) => {
            setHistory(prev => [record, ...prev]);
          };

          // 清空记录
          const clearHistory = () => {
             if(confirm("确定要删除所有历史记录吗？此操作无法恢复。")) {
                 setHistory([]);
             }
          };
          
          return (
            <div className="flex flex-col h-screen bg-slate-50 text-slate-800 font-sans max-w-md mx-auto shadow-2xl overflow-hidden relative">
              
              <header className="bg-blue-600 text-white p-4 pt-12 pb-6 shadow-lg rounded-b-[2rem] relative z-10">
                <div className="flex justify-between items-center mb-2">
                  <div>
                    <h1 className="text-xl font-bold flex items-center gap-2">
                      <Scale className="w-6 h-6" /> 智能伤情鉴定助手
                    </h1>
                    <p className="text-blue-100 text-xs mt-1 opacity-90">基于《人体损伤程度鉴定标准》</p>
                  </div>
                </div>
              </header>

              <main className="flex-1 overflow-y-auto pb-20">
                {activeTab === 'home' && <HomeView onSave={addToHistory} />}
                {activeTab === 'standards' && <StandardsView />}
                {activeTab === 'history' && <HistoryView history={history} onClear={clearHistory} />}
              </main>

              <nav className="bg-white border-t border-slate-200 fixed bottom-0 w-full max-w-md flex justify-around py-3 pb-6 z-20">
                <NavButton 
                  icon={<Home size={24} />} 
                  label="鉴定分析" 
                  active={activeTab === 'home'} 
                  onClick={() => setActiveTab('home')} 
                />
                <NavButton 
                  icon={<BookOpen size={24} />} 
                  label="标准库" 
                  active={activeTab === 'standards'} 
                  onClick={() => setActiveTab('standards')} 
                />
                <NavButton 
                  icon={<FileText size={24} />} 
                  label="历史记录" 
                  active={activeTab === 'history'} 
                  onClick={() => setActiveTab('history')} 
                />
              </nav>

              {showDisclaimer && (
                <div className="absolute inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-6">
                  <div className="bg-white rounded-2xl p-6 max-w-sm shadow-2xl animate-in fade-in zoom-in duration-300">
                    <div className="flex justify-center mb-4 text-orange-500">
                      <AlertTriangle size={48} />
                    </div>
                    <h3 className="text-lg font-bold text-center mb-2">免责声明</h3>
                    <p className="text-sm text-slate-600 mb-6 leading-relaxed">
                      本工具提供的分析结果仅供参考，基于AI模型的初步判断，**不具备法律效力**。最终伤情鉴定结果请以具有司法鉴定资质的机构出具的正式报告为准。
                    </p>
                    <button 
                      onClick={() => setShowDisclaimer(false)}
                      className="w-full bg-blue-600 text-white py-3 rounded-xl font-semibold hover:bg-blue-700 transition active:scale-95"
                    >
                      我已知晓，进入应用
                    </button>
                  </div>
                </div>
              )}
            </div>
          );
        }

        // --- 子组件: 首页 (鉴定分析) ---
        function HomeView({ onSave }) {
          const [textInput, setTextInput] = useState('');
          const [selectedImage, setSelectedImage] = useState(null);
          const [imageBase64, setImageBase64] = useState(null); 
          const [isAnalyzing, setIsAnalyzing] = useState(false);
          const [result, setResult] = useState(null);
          const [errorMsg, setErrorMsg] = useState('');
          const fileInputRef = useRef(null);

          const handleImageUpload = (e) => {
            const file = e.target.files[0];
            if (file) {
              const imageUrl = URL.createObjectURL(file);
              setSelectedImage(imageUrl);
              setResult(null);
              setErrorMsg('');

              const reader = new FileReader();
              reader.onloadend = () => {
                const base64String = reader.result.split(',')[1];
                setImageBase64(base64String);
                if (!textInput) {
                  setTextInput("（图片已加载，系统将分析图片中的医疗报告内容...）");
                }
              };
              reader.readAsDataURL(file);
            }
          };

          const handleAnalyze = async () => {
            if (!textInput && !selectedImage) return;
            
            setIsAnalyzing(true);
            setResult(null);
            setErrorMsg('');

            if (PROXY_URL || DIRECT_API_KEY) {
              try {
                const aiResult = await callGeminiAPI(textInput, imageBase64);
                setResult(aiResult);
                
                // 保存到历史记录
                onSave({
                  id: Date.now(),
                  date: new Date().toLocaleDateString(),
                  title: textInput.substring(0, 15) + (textInput.length > 15 ? "..." : ""),
                  grade: aiResult.grade,
                  logic: aiResult.logic
                });

                setIsAnalyzing(false);
                return;
              } catch (err) {
                console.error("API Error:", err);
                
                if (err.message.includes("Failed to fetch") && PROXY_URL && PROXY_URL.startsWith("https:")) {
                    setErrorMsg("连接服务器失败 (可能是自签名证书未被信任)。请手动访问一次代理地址。已切换至演示模式。");
                } else if (err.message.includes("Failed to fetch")) {
                    setErrorMsg("连接服务器失败。请检查网络或代理配置。已切换至演示模式。");
                } else {
                    setErrorMsg(`AI 服务错误 (${err.message})。已切换至演示模式。`);
                }
                runLocalSimulation();
              }
            } else {
               console.log("No config found. Running in local simulation mode.");
               runLocalSimulation();
            }
          };

          const runLocalSimulation = () => {
             setTimeout(() => {
              setIsAnalyzing(false);
              let aiResult = {
                grade: "未达到轻伤标准或需进一步检查",
                logic: "根据描述，未发现明显符合轻伤及以上标准的损伤特征。请补充详细的CT或X光报告数据。",
                matches: []
              };

              if (textInput.includes("头皮") && (textInput.includes("8cm") || textInput.includes("9cm") || textInput.includes("10cm"))) {
                aiResult = {
                  grade: "轻伤二级",
                  logic: "检测到关键词'头皮'及长度数值。根据《标准》5.1.4e条，头皮创口或者瘢痕长度累计8.0cm以上构成轻伤二级。",
                  matches: ["5.1.4e 头皮创口或者瘢痕长度累计8.0cm以上"]
                };
              } else if (textInput.includes("骨折") && textInput.includes("肋骨") && (textInput.includes("2") || textInput.includes("二"))) {
                aiResult = {
                  grade: "轻伤二级",
                  logic: "检测到'肋骨骨折'及数量。根据《标准》5.6.4b条，肋骨骨折2处以上构成轻伤二级。",
                  matches: ["5.6.4b 肋骨骨折2处以上"]
                };
              } else if (textInput.includes("骨折")) {
                 aiResult = {
                  grade: "轻伤一级",
                  logic: "检测到'骨折'，通常四肢长骨骨折构成轻伤一级，需结合具体部位确认。",
                  matches: ["5.9.3a 四肢长骨骨折"]
                };
              }
              
              setResult(aiResult);
              
              // 保存模拟结果到历史
              onSave({
                  id: Date.now(),
                  date: new Date().toLocaleDateString(),
                  title: textInput.substring(0, 15) + (textInput.length > 15 ? "..." : ""),
                  grade: aiResult.grade,
                  logic: aiResult.logic
              });

            }, 1500);
          }

          const clearAll = () => {
            setTextInput('');
            setSelectedImage(null);
            setImageBase64(null);
            setResult(null);
            setErrorMsg('');
          };

          return (
            <div className="p-4 space-y-4">
              <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <h2 className="font-semibold text-slate-700 mb-3 flex items-center gap-2">
                  <Activity className="w-4 h-4 text-blue-500" /> 上传资料
                </h2>
                
                <div 
                  onClick={() => fileInputRef.current.click()}
                  className={`border-2 border-dashed rounded-xl p-6 text-center transition-colors cursor-pointer mb-4 ${selectedImage ? 'border-blue-300 bg-blue-50' : 'border-slate-300 hover:border-blue-400'}`}
                >
                  <input type="file" ref={fileInputRef} className="hidden" accept="image/*" onChange={handleImageUpload} />
                  {selectedImage ? (
                    <div className="relative">
                      <img src={selectedImage} alt="Uploaded" className="h-32 mx-auto object-contain rounded-md" />
                      <p className="text-xs text-blue-600 mt-2">点击更换图片</p>
                    </div>
                  ) : (
                    <div className="flex flex-col items-center gap-2 text-slate-400">
                      <Camera size={32} />
                      <span className="text-sm">拍照或上传病历/诊断书/X光片</span>
                    </div>
                  )}
                </div>

                <div>
                  <label className="text-xs text-slate-500 font-medium mb-1 block">病情描述 / 报告文本</label>
                  <textarea 
                    value={textInput}
                    onChange={(e) => setTextInput(e.target.value)}
                    className="w-full bg-slate-50 border border-slate-200 rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 min-h-[100px]"
                    placeholder="例如：左侧第3、4肋骨骨折，伴有少量积液..."
                  ></textarea>
                </div>

                {errorMsg && (
                  <div className="mt-2 text-xs text-red-600 bg-red-50 p-2 rounded border border-red-200 animate-pulse">
                    {errorMsg}
                  </div>
                )}

                <div className="flex gap-3 mt-4">
                  <button 
                    onClick={clearAll}
                    className="px-4 py-2 text-slate-500 bg-slate-100 rounded-lg text-sm font-medium"
                  >
                    重置
                  </button>
                  <button 
                    onClick={handleAnalyze}
                    disabled={(!textInput && !selectedImage) || isAnalyzing}
                    className={`flex-1 py-3 rounded-lg font-bold text-white shadow-md flex justify-center items-center gap-2
                      ${(!textInput && !selectedImage) || isAnalyzing ? 'bg-slate-300' : 'bg-gradient-to-r from-blue-500 to-indigo-600 active:scale-95 transition-transform'}
                    `}
                  >
                    {isAnalyzing ? (
                      <>
                        <div className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                        分析中...
                      </>
                    ) : (
                      <>
                        <Activity size={18} /> 开始智能鉴定
                      </>
                    )}
                  </button>
                </div>
              </div>

              {result && (
                <div className="bg-white rounded-2xl shadow-lg border-t-4 border-blue-500 animate-in slide-in-from-bottom-4 duration-500 overflow-hidden mb-4">
                  <div className="bg-blue-50 p-4 border-b border-blue-100">
                    <h3 className="font-bold text-blue-900 flex justify-between items-center">
                      分析结果
                    </h3>
                  </div>
                  <div className="p-5">
                    <div className="mb-4">
                      <span className="text-xs text-slate-500 uppercase tracking-wider">预估等级</span>
                      <div className="text-2xl font-extrabold text-slate-800 mt-1">{result.grade}</div>
                    </div>
                    
                    {result.explanation && (
                        <div className="bg-blue-50 p-3 rounded-lg border border-blue-100 mb-3">
                            <span className="text-xs text-blue-600 font-bold flex items-center gap-1 mb-1">
                                <MessageSquare size={12} /> 专家点评 / 补充说明
                            </span>
                            <p className="text-sm text-slate-700 leading-relaxed whitespace-pre-wrap">
                                {result.explanation}
                            </p>
                        </div>
                    )}

                    <div className="mb-4 bg-slate-50 p-3 rounded-lg">
                      <span className="text-xs text-slate-500 font-bold flex items-center gap-1 mb-2">
                        <CheckCircle size={12} className="text-green-500"/> 判定逻辑
                      </span>
                      <p className="text-sm text-slate-700 leading-relaxed">{result.logic}</p>
                    </div>

                    {result.matches.length > 0 && (
                      <div className="mb-2">
                        <span className="text-xs text-slate-500 font-bold mb-2 block">参考标准条款</span>
                        <ul className="space-y-2">
                          {result.matches.map((m, i) => (
                            <li key={i} className="text-xs bg-indigo-50 text-indigo-700 p-2 rounded border border-indigo-100">
                              {m}
                            </li>
                          ))}
                        </ul>
                      </div>
                    )}
                  </div>
                  <div className="bg-yellow-50 p-3 text-[10px] text-yellow-800 text-center">
                    结果仅供参考，不可作为法律依据
                  </div>
                </div>
              )}
            </div>
          );
        }

        // --- 子组件: 历史记录 (实时功能版) ---
        function HistoryView({ history, onClear }) {
          return (
            <div className="p-4">
              <div className="flex justify-between items-center mb-4">
                  <h2 className="text-lg font-bold text-slate-800">历史鉴定记录</h2>
                  {history.length > 0 && (
                      <button onClick={onClear} className="text-xs text-red-500 flex items-center gap-1 hover:bg-red-50 px-2 py-1 rounded transition-colors">
                          <Trash2 size={14} /> 清空
                      </button>
                  )}
              </div>
              
              <div className="space-y-3">
                {history.length === 0 ? (
                    <div className="text-center py-10 text-slate-400">
                        <FileText size={48} className="mx-auto mb-3 opacity-20" />
                        <p>暂无历史记录</p>
                    </div>
                ) : (
                    history.map((item) => (
                      <div key={item.id} className="bg-white p-4 rounded-xl border border-slate-100 shadow-sm flex flex-col gap-2">
                        <div className="flex justify-between items-start">
                           <div>
                              <h4 className="font-semibold text-slate-700">{item.title || "未命名记录"}</h4>
                              <p className="text-xs text-slate-400 mt-1">{item.date}</p>
                           </div>
                           <span className="text-xs font-bold bg-blue-50 text-blue-600 px-2 py-1 rounded">
                            {item.grade}
                           </span>
                        </div>
                        {item.logic && (
                           <p className="text-xs text-slate-500 line-clamp-2 bg-slate-50 p-2 rounded">
                             {item.logic}
                           </p>
                        )}
                      </div>
                    ))
                )}
              </div>
              
              <div className="mt-8 p-4 bg-blue-50 rounded-xl border border-blue-100">
                <div className="flex gap-3">
                   <div className="bg-blue-100 p-2 rounded-lg h-fit text-blue-600">
                     <AlertCircle size={20} />
                   </div>
                   <div>
                     <h4 className="text-sm font-bold text-blue-800 mb-1">提示</h4>
                     <p className="text-xs text-blue-700 leading-relaxed">
                       历史记录仅保存在本地缓存 (LocalStorage) 中，清除浏览器缓存会导致记录丢失。
                     </p>
                   </div>
                </div>
              </div>
            </div>
          );
        }

        async function callGeminiAPI(text, imageBase64) {
          const promptText = `
            你是一名专业的法医临床鉴定专家。请根据提供的用户描述或医疗图片内容，严格依据中国《人体损伤程度鉴定标准》进行分析。
            
            请按以下 JSON 格式返回结果（不要包含 Markdown 代码块标记）：
            {
              "grade": "鉴定等级（如：轻伤二级、轻微伤、重伤一级等）",
              "logic": "详细的鉴定分析逻辑，引用具体的解剖学改变和功能障碍。",
              "matches": ["引用标准条款1", "引用标准条款2"]
            }

            如果信息不足以判断，grade 请填 "无法判断/需补充材料"，logic 说明缺失什么信息。
            用户提供的描述：${text}
          `;

          const requestBody = {
            contents: [{
              parts: [
                { text: promptText },
                ...(imageBase64 ? [{
                  inline_data: {
                    mime_type: "image/jpeg",
                    data: imageBase64
                  }
                }] : [])
              ]
            }]
          };

          let response;

          if (PROXY_URL) {
              console.log("Using Proxy:", PROXY_URL);
              response = await fetch(PROXY_URL, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify(requestBody)
              });
          } else if (DIRECT_API_KEY) {
              console.log("Using Direct API");
              const MODEL = "gemini-2.0-flash";
              const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${DIRECT_API_KEY}`;
              response = await fetch(API_URL, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify(requestBody)
              });
          } else {
              throw new Error("请配置 PROXY_URL 或 DIRECT_API_KEY");
          }

          if (!response.ok) {
            const errData = await response.json().catch(() => ({}));
            throw new Error(errData.error?.message || `API 请求失败: ${response.status}`);
          }

          const data = await response.json();
          const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
          
          if (!rawText) throw new Error("未收到有效回复");
            
          let jsonPart = null;
          let textPart = "";
          const firstOpen = rawText.indexOf('{');
          const lastClose = rawText.lastIndexOf('}');
            
          if (firstOpen !== -1 && lastClose !== -1 && lastClose > firstOpen) {
              jsonPart = rawText.substring(firstOpen, lastClose + 1);
              const beforeJSON = rawText.substring(0, firstOpen);
              const afterJSON = rawText.substring(lastClose + 1);
              textPart = (beforeJSON + "\n" + afterJSON).replace(/```json|```/g, "").trim();
          } else {
               textPart = rawText.replace(/```json|```/g, "").trim();
          }
            
          let parsedData = {};
          try {
              if (jsonPart) {
                  parsedData = JSON.parse(jsonPart);
              }
          } catch (e) {
              console.error("JSON Parse Error", e);
              parsedData = {
                  grade: "解析异常",
                  logic: rawText,
                  matches: []
              };
          }

          const finalResult = {
              grade: parsedData.grade || "评估结果",
              logic: parsedData.logic || "",
              matches: parsedData.matches || [],
              explanation: textPart 
          };
          
          if (!finalResult.logic && finalResult.explanation) {
              finalResult.logic = finalResult.explanation;
              finalResult.explanation = ""; 
          }

          return finalResult;
        }

        function StandardsView() {
          const [searchTerm, setSearchTerm] = useState('');
          
          const filteredStandards = STANDARD_DB.map(cat => ({
            ...cat,
            items: cat.items.filter(item => 
              item.desc.includes(searchTerm) || cat.category.includes(searchTerm) || item.grade.includes(searchTerm)
            )
          })).filter(cat => cat.items.length > 0);

          return (
            <div className="p-4">
              <div className="sticky top-0 z-10 bg-slate-50 pb-4">
                <div className="relative">
                  <Search className="absolute left-3 top-3 text-slate-400" size={18} />
                  <input 
                    type="text" 
                    placeholder="搜索标准（如：肋骨、瘢痕...）"
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    className="w-full bg-white pl-10 pr-4 py-3 rounded-xl border border-slate-200 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
                  />
                </div>
              </div>

              <div className="space-y-4">
                {filteredStandards.length > 0 ? (
                  filteredStandards.map((cat, idx) => (
                    <div key={idx} className="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
                      <div className="bg-slate-100 px-4 py-2 font-bold text-slate-700 text-sm flex justify-between items-center">
                        {cat.category}
                        <ChevronRight size={14} className="text-slate-400"/>
                      </div>
                      <div className="divide-y divide-slate-50">
                        {cat.items.map((item, i) => (
                          <div key={i} className="p-4 hover:bg-slate-50 transition-colors">
                            <div className="flex items-start gap-3">
                              <span className={`shrink-0 text-xs px-2 py-1 rounded font-bold mt-0.5
                                ${item.grade.includes("重伤") ? 'bg-red-100 text-red-600' : 
                                  item.grade.includes("轻伤") ? 'bg-orange-100 text-orange-600' : 
                                  'bg-green-100 text-green-600'
                                }
                              `}>
                                {item.grade}
                              </span>
                              <p className="text-sm text-slate-600 whitespace-pre-wrap">{item.desc}</p>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  ))
                ) : (
                  <div className="text-center py-20 text-slate-400">
                    <Search size={48} className="mx-auto mb-4 opacity-20" />
                    <p>未找到相关条款</p>
                  </div>
                )}
              </div>
            </div>
          );
        }

        function NavButton({ icon, label, active, onClick }) {
          return (
            <button 
              onClick={onClick}
              className={`flex flex-col items-center gap-1 w-16 transition-colors ${active ? 'text-blue-600' : 'text-slate-400 hover:text-slate-500'}`}
            >
              <div className={`transition-transform duration-200 ${active ? 'scale-110' : ''}`}>
                {icon}
              </div>
              <span className="text-[10px] font-medium">{label}</span>
            </button>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<SmartInjuryAssessment />);
    </script>
