<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 伤残鉴定助手</title>
    
    <!-- 1. 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. 引入 React 和 ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- 3. 引入 Babel (用于在浏览器中解析 JSX) -->
    <script src="https://unpkg.com/@babel/standalone@7.26.0/babel.min.js"></script>

    <style>
        /* 隐藏滚动条但保留功能 */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* 基础样式重置 */
        body {
            background-color: #f8fafc; /* slate-50 */
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ==========================================
        //  配置区域
        // ==========================================
        
        // ⚠️ 重要提示：
        // 您使用的是自签名证书 (IP地址无法申请正式证书)。
        // 您必须在浏览器新标签页中访问一次下面的地址：
        // https://45.32.47.204:3000/
        // 并点击 "高级" -> "继续前往 (不安全)"，以此手动信任证书。
        // 否则前端依然会报 "Failed to fetch" 错误。
        const PROXY_URL = "https://gemini.lintsing.net:3000/api/analyze"; 

        // 方式 B: 前端直连 Google (留空即可)
        const DIRECT_API_KEY = ""; 
        
        // ==========================================

        
        // --- 图标组件定义 ---
        const IconWrapper = ({ children, size = 24, className = "" }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width={size} 
                height={size} 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className}
            >
                {children}
            </svg>
        );

        const Scale = (props) => <IconWrapper {...props}><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></IconWrapper>;
        const Home = (props) => <IconWrapper {...props}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></IconWrapper>;
        const BookOpen = (props) => <IconWrapper {...props}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></IconWrapper>;
        const FileText = (props) => <IconWrapper {...props}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></IconWrapper>;
        const Activity = (props) => <IconWrapper {...props}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></IconWrapper>;
        const Search = (props) => <IconWrapper {...props}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></IconWrapper>;
        const ChevronRight = (props) => <IconWrapper {...props}><polyline points="9 18 15 12 9 6"/></IconWrapper>;
        const AlertTriangle = (props) => <IconWrapper {...props}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></IconWrapper>;
        const Camera = (props) => <IconWrapper {...props}><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></IconWrapper>;
        const Upload = (props) => <IconWrapper {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></IconWrapper>;
        const CheckCircle = (props) => <IconWrapper {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></IconWrapper>;
        const AlertCircle = (props) => <IconWrapper {...props}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></IconWrapper>;
        const Trash2 = (props) => <IconWrapper {...props}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></IconWrapper>;
        const X = (props) => <IconWrapper {...props}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></IconWrapper>;
        const MessageSquare = (props) => <IconWrapper {...props}><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></IconWrapper>;

        /**
         * 《人体损伤致残程度分级》核心数据库 (精简版)
         */
        const STANDARD_DB = [
            {
                category: "5.1 颅脑、脊髓及周围神经损伤",
                items: [
                { grade: "一级伤残", desc: "a) 植物生存状态。\nb) 四肢瘫（三肢以上肌力3级以下）。\nc) 偏瘫、截瘫（肌力2级以下），伴大便、小便失禁。" },
                { grade: "二级伤残", desc: "a) 四肢瘫（二肢以上肌力2级以下）。\nb) 偏瘫、截瘫（肌力2级以下）。" },
                { grade: "三级伤残", desc: "a) 手足徐动症，重度。\nb) 智力缺损，重度。" },
                { grade: "五级伤残", desc: "a) 莫氏II型二度房室传导阻滞。\nb) 偏瘫、截瘫（一肢以上肌力2级以下）。\nc) 完全性失语或者混合性失语。" },
                { grade: "七级伤残", desc: "a) 偏瘫、截瘫（一肢以上肌力4级以下）。\nb) 截瘫（肌力4级以下），伴排尿障碍。" },
                { grade: "十级伤残", desc: "a) 脑神经损伤致神经功能障碍。\nb) 颅脑损伤后，遗留脑软化灶形成，伴有神经系统症状或者体征。\nc) 颅骨缺损或者颅底骨折伴脑脊液漏。" }
                ]
            },
            {
                category: "5.2 头面部损伤",
                items: [
                { grade: "一级伤残", desc: "a) 容貌毁损（重度）。" },
                { grade: "四级伤残", desc: "a) 容貌毁损（中度）。" },
                { grade: "七级伤残", desc: "a) 容貌毁损（轻度）。\nb) 面部瘢痕形成，面积累计24.0cm²以上。" },
                { grade: "八级伤残", desc: "a) 面部瘢痕形成，面积累计18.0cm²以上。\nb) 面部条状瘢痕形成，累计长度20.0cm以上。" },
                { grade: "九级伤残", desc: "a) 面部瘢痕形成，面积累计12.0cm²以上。\nb) 面部条状瘢痕形成，累计长度12.0cm以上。" },
                { grade: "十级伤残", desc: "a) 面部瘢痕形成，面积累计6.0cm²以上。\nb) 面部条状瘢痕形成，累计长度10.0cm以上。\nc) 面部细小瘢痕（或者色素明显改变）面积累计30.0cm²以上。" }
                ]
            },
            {
                category: "5.4 视器视力损伤",
                items: [
                { grade: "一级伤残", desc: "a) 双眼球缺失。\nb) 双眼盲目5级。" },
                { grade: "四级伤残", desc: "a) 双眼盲目3级。\nb) 一眼盲目4级，另一眼低视力2级。" },
                { grade: "五级伤残", desc: "a) 一眼盲目3级，另一眼低视力1级。\nb) 双眼低视力2级。" },
                { grade: "八级伤残", desc: "a) 一眼盲目4级。\nb) 双眼低视力1级。" },
                { grade: "九级伤残", desc: "a) 一眼盲目3级。" },
                { grade: "十级伤残", desc: "a) 一眼低视力1级。\nb) 一眼视野半径50度以下（视野有效值80%以下）。" }
                ]
            },
            {
                category: "5.6 胸部损伤",
                items: [
                { grade: "二级伤残", desc: "a) 心功能不全，心功能IV级。" },
                { grade: "七级伤残", desc: "a) 肺叶切除术后。\nb) 心功能不全，心功能II级。" },
                { grade: "九级伤残", desc: "a) 心脏异物滞留或者取出术后。\nb) 肺段或者肺组织楔形切除术后。" },
                { grade: "十级伤残", desc: "a) 肺破裂修补术后。\nb) 肋骨骨折6根以上，或者肋骨骨折4根以上并后遗2处畸形愈合。" }
                ]
            },
            {
                category: "5.9 脊柱、四肢损伤",
                items: [
                { grade: "一级伤残", desc: "a) 三肢以上缺失(上肢腕关节以上,下肢踝关节以上)。\nb) 三肢以上完全丧失功能。" },
                { grade: "五级伤残", desc: "a) 一肢缺失（上肢肘关节以上，下肢膝关节以上）。\nb) 一肢完全丧失功能。" },
                { grade: "七级伤残", desc: "a) 双下肢长度相差8.0cm以上。\nb) 一肢丧失功能50%以上。" },
                { grade: "九级伤残", desc: "a) 双下肢长度相差4.0cm以上。\nb) 一肢丧失功能25%以上。" },
                { grade: "十级伤残", desc: "a) 双下肢长度相差2.0cm以上。\nb) 一肢丧失功能10%以上。\nc) 四肢长骨一骺板以上粉碎性骨折。" }
                ]
            },
            {
                category: "5.10 手、足损伤",
                items: [
                { grade: "六级伤残", desc: "a) 双手缺失（或丧失功能）70%以上。\nb) 双足跗跖关节以上缺失。" },
                { grade: "八级伤残", desc: "a) 一手缺失（或丧失功能）50%以上。\nb) 双手缺失（或丧失功能）30%以上。" },
                { grade: "九级伤残", desc: "a) 一手缺失（或丧失功能）25%以上。\nb) 一足缺失（或丧失功能）50%以上。" },
                { grade: "十级伤残", desc: "a) 一手缺失（或丧失功能）5%以上。\nb) 双手缺失（或丧失功能）5%以上。\nc) 一足缺失（或丧失功能）10%以上。" }
                ]
            }
        ];

        // --- 主组件 ---
        function SmartDisabilityAssessment() {
            const [activeTab, setActiveTab] = useState('home'); 
            const [showDisclaimer, setShowDisclaimer] = useState(true);
            const [history, setHistory] = useState([]);

            // 初始化加载历史记录
            useEffect(() => {
                const saved = localStorage.getItem('disability_history');
                if (saved) {
                setHistory(JSON.parse(saved));
                }
            }, []);

            const saveToHistory = (record) => {
                const newHistory = [record, ...history];
                setHistory(newHistory);
                localStorage.setItem('disability_history', JSON.stringify(newHistory));
            };

            const clearHistory = () => {
                if(confirm('确定清空所有记录吗？')) {
                setHistory([]);
                localStorage.removeItem('disability_history');
                }
            };

            return (
                <div className="flex flex-col h-screen bg-slate-50 text-slate-800 font-sans max-w-md mx-auto shadow-2xl overflow-hidden relative">
                
                {/* 顶部导航 */}
                <header className="bg-emerald-600 text-white p-4 pt-12 pb-6 shadow-lg rounded-b-[2rem] relative z-10 transition-all">
                    <div className="flex justify-between items-center mb-2">
                    <div>
                        <h1 className="text-xl font-bold flex items-center gap-2">
                        <Scale className="w-6 h-6" /> 伤残等级AI鉴定
                        </h1>
                        <p className="text-emerald-100 text-xs mt-1 opacity-90">基于《人体损伤致残程度分级》 (一级至十级)</p>
                    </div>
                    </div>
                </header>

                {/* 主内容区域 */}
                <main className="flex-1 overflow-y-auto pb-20 scrollbar-hide">
                    {activeTab === 'home' && <HomeView onSave={saveToHistory} />}
                    {activeTab === 'standards' && <StandardsView />}
                    {activeTab === 'history' && <HistoryView history={history} onClear={clearHistory} />}
                </main>

                {/* 底部 Tab 导航 */}
                <nav className="bg-white border-t border-slate-200 fixed bottom-0 w-full max-w-md flex justify-around py-3 pb-6 z-20 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                    <NavButton 
                    icon={<Home size={24} />} 
                    label="AI鉴定" 
                    active={activeTab === 'home'} 
                    onClick={() => setActiveTab('home')} 
                    activeColor="text-emerald-600"
                    />
                    <NavButton 
                    icon={<BookOpen size={24} />} 
                    label="标准库" 
                    active={activeTab === 'standards'} 
                    onClick={() => setActiveTab('standards')} 
                    activeColor="text-emerald-600"
                    />
                    <NavButton 
                    icon={<FileText size={24} />} 
                    label="记录" 
                    active={activeTab === 'history'} 
                    onClick={() => setActiveTab('history')} 
                    activeColor="text-emerald-600"
                    />
                </nav>

                {/* 免责声明弹窗 */}
                {showDisclaimer && (
                    <div className="absolute inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-6 animate-in fade-in duration-300">
                    <div className="bg-white rounded-2xl p-6 max-w-sm shadow-2xl transform transition-all scale-100">
                        <div className="flex justify-center mb-4 text-emerald-500">
                        <AlertTriangle size={48} />
                        </div>
                        <h3 className="text-lg font-bold text-center mb-2 text-slate-800">重要免责声明</h3>
                        <p className="text-sm text-slate-600 mb-6 leading-relaxed text-justify">
                        本工具基于AI算法对<b>《人体损伤致残程度分级》</b>进行辅助分析，结果<b>仅供参考</b>，不可直接用于理赔或诉讼证据。
                        <br/><br/>
                        正式伤残等级必须由具备司法鉴定资质的机构出具。
                        </p>
                        <button 
                        onClick={() => setShowDisclaimer(false)}
                        className="w-full bg-emerald-600 text-white py-3 rounded-xl font-semibold hover:bg-emerald-700 transition active:scale-95 shadow-md shadow-emerald-200"
                        >
                        我已知晓，开始使用
                        </button>
                    </div>
                    </div>
                )}
                </div>
            );
        }

        // --- 子组件: 首页 (鉴定分析) ---

        function HomeView({ onSave }) {
            const [textInput, setTextInput] = useState('');
            const [selectedImage, setSelectedImage] = useState(null);
            const [imageBase64, setImageBase64] = useState(null);
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [result, setResult] = useState(null);
            const [errorMsg, setErrorMsg] = useState('');
            const fileInputRef = useRef(null);

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                const imageUrl = URL.createObjectURL(file);
                setSelectedImage(imageUrl);
                setResult(null);
                setErrorMsg('');

                const reader = new FileReader();
                reader.onloadend = () => {
                    const base64String = reader.result.split(',')[1];
                    setImageBase64(base64String);
                    if (!textInput) {
                    setTextInput("（已上传影像资料，请AI结合影像分析伤残等级...）");
                    }
                };
                reader.readAsDataURL(file);
                }
            };

            // 提取出来的模拟逻辑，用于出错时降级处理
            const runMockAnalysis = (text) => {
                 setTimeout(() => {
                    setIsAnalyzing(false);
                    
                    let aiResult = {
                        grade: "可能不构成伤残",
                        summary: "未发现明显符合致残标准的严重损伤。",
                        logic: "根据《人体损伤致残程度分级》，一般软组织损伤或愈合良好的骨折若无功能障碍，往往达不到十级伤残标准。建议补充复查后的关节活动度数据。",
                        matches: [],
                        explanation: ""
                    };

                    if (text.includes("肋骨") && (text.includes("6") || text.includes("六"))) {
                        aiResult = {
                        grade: "十级伤残",
                        summary: "肋骨骨折6根以上。",
                        logic: "依据《人体损伤致残程度分级》5.6.5.b条款，肋骨骨折6根以上，或者肋骨骨折4根以上并后遗2处畸形愈合，构成十级伤残。",
                        matches: ["5.6.5b 肋骨骨折6根以上"]
                        };
                    } else if (text.includes("脾") && text.includes("切除")) {
                        aiResult = {
                        grade: "八级伤残",
                        summary: "脾部分切除术后。",
                        logic: "依据《人体损伤致残程度分级》5.7.4.b条款，脾部分切除，构成八级伤残。若为全切除则等级更高（七级）。",
                        matches: ["5.7.4b 脾部分切除"]
                        };
                    } else if (text.includes("截瘫")) {
                        aiResult = {
                        grade: "一级伤残（疑似）",
                        summary: "严重脊髓损伤。",
                        logic: "检测到截瘫关键词，若伴有大小便失禁且肌力2级以下，可能符合5.1.1.c 一级伤残标准。",
                        matches: ["5.1.1c 偏瘫、截瘫（肌力2级以下）"]
                        };
                    }

                    setResult(aiResult);
                    onSave({
                        id: Date.now(),
                        date: new Date().toLocaleDateString(),
                        input: text.length > 20 ? text.substring(0, 20) + "..." : text,
                        ...aiResult
                    });
                }, 1500);
            };

            const handleAnalyze = async () => {
                if (!textInput && !selectedImage) return;
                
                setIsAnalyzing(true);
                setResult(null);
                setErrorMsg('');

                // 优先使用真实 API (Direct 或 Proxy)
                if (PROXY_URL || DIRECT_API_KEY) {
                    try {
                        const aiResult = await callGeminiAPI(textInput, imageBase64);
                        setResult(aiResult);
                        onSave({
                            id: Date.now(),
                            date: new Date().toLocaleDateString(),
                            input: textInput.substring(0, 30) + "...",
                            ...aiResult
                        });
                        setIsAnalyzing(false);
                        return; // 成功则退出
                    } catch (err) {
                        console.error("API Error, failing over to mock:", err);
                        
                        // 智能错误提示
                        if (err.message.includes("Failed to fetch") && PROXY_URL.startsWith("http:")) {
                            setErrorMsg("连接服务器失败 (混合内容错误：HTTPS网页无法访问HTTP服务器)。已自动切换至演示模式。");
                        } else {
                            setErrorMsg(`API 调用失败 (${err.message})，已切换至演示模式。`);
                        }
                        
                        // 降级到模拟模式，不让应用卡死
                        runMockAnalysis(textInput);
                        return;
                    }
                }

                // 如果没有配置 Key/Proxy，直接运行模拟模式
                console.log("Running in local simulation mode.");
                runMockAnalysis(textInput);
            };

            const clearAll = () => {
                setTextInput('');
                setSelectedImage(null);
                setImageBase64(null);
                setResult(null);
                setErrorMsg('');
            };

            return (
                <div className="p-4 space-y-4">
                {/* 输入区域 */}
                <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                    <h2 className="font-semibold text-slate-700 mb-3 flex items-center gap-2">
                    <Activity className="w-4 h-4 text-emerald-500" /> 伤情资料录入
                    </h2>
                    
                    {/* 图片上传区域 */}
                    <div 
                    onClick={() => fileInputRef.current.click()}
                    className={`border-2 border-dashed rounded-xl p-6 text-center transition-colors cursor-pointer mb-4 group relative overflow-hidden
                        ${selectedImage ? 'border-emerald-300 bg-emerald-50' : 'border-slate-300 hover:border-emerald-400 hover:bg-slate-50'}`}
                    >
                    <input type="file" ref={fileInputRef} className="hidden" accept="image/*" onChange={handleImageUpload} />
                    {selectedImage ? (
                        <div className="relative z-10">
                        <img src={selectedImage} alt="Uploaded" className="h-32 mx-auto object-contain rounded-md shadow-sm" />
                        <p className="text-xs text-emerald-600 mt-2 font-medium">点击更换图片</p>
                        </div>
                    ) : (
                        <div className="flex flex-col items-center gap-2 text-slate-400 group-hover:text-emerald-500 transition-colors">
                        <Camera size={32} />
                        <span className="text-sm">拍照或上传 X光/CT/诊断书</span>
                        </div>
                    )}
                    </div>

                    {/* 文本输入 */}
                    <div className="relative">
                    <label className="text-xs text-slate-500 font-medium mb-1 block ml-1">详细描述 (诊断结论/手术记录/恢复情况)</label>
                    <textarea 
                        value={textInput}
                        onChange={(e) => setTextInput(e.target.value)}
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 min-h-[120px] resize-none transition-shadow"
                        placeholder="例如：车祸致脾破裂，行脾切除术后。目前伤口愈合良好..."
                    ></textarea>
                    </div>

                    {/* 错误提示 */}
                    {errorMsg && (
                    <div className="mt-2 text-xs text-orange-600 bg-orange-50 p-2 rounded flex items-center gap-1 animate-pulse border border-orange-200">
                        <AlertCircle size={12} /> {errorMsg}
                    </div>
                    )}

                    {/* 按钮组 */}
                    <div className="flex gap-3 mt-4">
                    <button 
                        onClick={clearAll}
                        className="px-4 py-2 text-slate-500 bg-slate-100 hover:bg-slate-200 rounded-xl text-sm font-medium transition-colors"
                    >
                        重置
                    </button>
                    <button 
                        onClick={handleAnalyze}
                        disabled={(!textInput && !selectedImage) || isAnalyzing}
                        className={`flex-1 py-3 rounded-xl font-bold text-white shadow-lg shadow-emerald-200 flex justify-center items-center gap-2 transition-all
                        ${(!textInput && !selectedImage) || isAnalyzing ? 'bg-slate-300 shadow-none cursor-not-allowed' : 'bg-gradient-to-r from-emerald-500 to-green-600 active:scale-95 hover:shadow-emerald-300'}
                        `}
                    >
                        {isAnalyzing ? (
                        <>
                            <div className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                            正在分析...
                        </>
                        ) : (
                        <>
                            <Activity size={18} /> 开始评估
                        </>
                        )}
                    </button>
                    </div>
                </div>

                {/* 结果区域 */}
                {result && (
                    <div className="bg-white rounded-2xl shadow-lg border-t-4 border-emerald-500 animate-in slide-in-from-bottom-4 duration-500 overflow-hidden mb-4">
                    {/* 结果头部 */}
                    <div className="bg-gradient-to-r from-emerald-50 to-white p-4 border-b border-emerald-100 flex justify-between items-end">
                        <div>
                        <div className="text-xs text-emerald-600 font-bold uppercase tracking-wider mb-1">评估结论</div>
                        <div className="text-2xl font-extrabold text-slate-800 leading-none">{result.grade}</div>
                        </div>
                        {result.summary && (
                        <div className="text-sm text-slate-500 font-medium max-w-[50%] text-right truncate">
                            {result.summary}
                        </div>
                        )}
                    </div>
                    
                    <div className="p-5 space-y-4">
                        
                        {/* 专家点评/补充说明 (提取自 JSON 外部的解释性文字) */}
                        {result.explanation && (
                            <div className="bg-blue-50 p-3 rounded-xl border border-blue-100">
                                <span className="text-xs text-blue-600 font-bold flex items-center gap-1 mb-1">
                                    <MessageSquare size={12} /> 专家点评 / 补充说明
                                </span>
                                <p className="text-sm text-slate-700 leading-relaxed whitespace-pre-wrap">
                                    {result.explanation}
                                </p>
                            </div>
                        )}

                        {/* 逻辑分析 */}
                        {result.logic && (
                            <div className="bg-slate-50 p-3 rounded-xl border border-slate-100">
                                <span className="text-xs text-slate-500 font-bold flex items-center gap-1 mb-2">
                                    <CheckCircle size={12} className="text-emerald-500"/> 分析依据
                                </span>
                                <p className="text-sm text-slate-700 leading-relaxed text-justify">
                                    {result.logic}
                                </p>
                            </div>
                        )}

                        {/* 条款引用 */}
                        {result.matches && result.matches.length > 0 && (
                        <div>
                            <span className="text-xs text-slate-400 font-bold mb-2 block ml-1">参考《分级》条款</span>
                            <ul className="space-y-2">
                            {result.matches.map((m, i) => (
                                <li key={i} className="text-xs bg-emerald-50 text-emerald-800 p-2.5 rounded-lg border border-emerald-100 font-medium">
                                {m}
                                </li>
                            ))}
                            </ul>
                        </div>
                        )}
                    </div>
                    <div className="bg-yellow-50 p-3 text-[10px] text-yellow-700 text-center border-t border-yellow-100">
                        * 结果仅供参考，不作为法律证据
                    </div>
                    </div>
                )}
                </div>
            );
        }

        // --- API 调用逻辑 (核心修改) ---

        async function callGeminiAPI(text, imageBase64) {
            // 构建 Prompt
            const promptText = `
                你是一位资深的法医临床鉴定专家。请依据中国现行的《人体损伤致残程度分级》（2017年1月1日起施行）对以下伤情进行伤残等级评估。
                注意：该标准将伤残分为一级（最重）至十级（最轻）。与《人体损伤程度鉴定标准》（轻伤/重伤）不同，请勿混淆。

                用户伤情描述: "${text}"

                请严格按照以下 JSON 格式返回结果（直接返回JSON，不要markdown标记）：
                {
                "grade": "一级至十级中的某一级，或者'不构成伤残'、'需补充材料'",
                "summary": "简短的伤情总结（如：脾切除术后）",
                "logic": "详细的分析理由，解释为什么符合该等级，引用解剖学改变或功能障碍程度。",
                "matches": ["条款编号及内容，例如：5.10.6.12 一手缺失5%以上"]
                }
            `;

            const requestBody = {
                contents: [{
                parts: [
                    { text: promptText },
                    ...(imageBase64 ? [{
                    inline_data: {
                        mime_type: "image/jpeg",
                        data: imageBase64
                    }
                    }] : [])
                ]
                }]
            };

            let response;

            // 模式判断
            if (PROXY_URL) {
                // 1. 中转模式：发送到自己的服务器
                console.log("Using Proxy:", PROXY_URL);
                response = await fetch(PROXY_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(requestBody)
                });
            } else if (DIRECT_API_KEY) {
                // 2. 直连模式：发送到 Google
                console.log("Using Direct API");
                const MODEL = "gemini-2.0-flash";
                const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${DIRECT_API_KEY}`;
                response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(requestBody)
                });
            } else {
                throw new Error("请配置 PROXY_URL 或 DIRECT_API_KEY");
            }

            if (!response.ok) {
                const errData = await response.json().catch(() => ({}));
                throw new Error(errData.error?.message || `请求失败: ${response.status}`);
            }

            const data = await response.json();
            const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
            
            if (!rawText) throw new Error("未收到有效回复");

            // --- 智能解析 (修复版) ---
            // 将回复内容拆分为 "JSON部分" 和 "解释性文字部分"
            
            let jsonPart = null;
            let textPart = "";
            const firstOpen = rawText.indexOf('{');
            const lastClose = rawText.lastIndexOf('}');
            
            if (firstOpen !== -1 && lastClose !== -1 && lastClose > firstOpen) {
                // 1. 提取 JSON
                jsonPart = rawText.substring(firstOpen, lastClose + 1);
                
                // 2. 提取除 JSON 外的文字 (前面 + 后面)
                const beforeJSON = rawText.substring(0, firstOpen);
                const afterJSON = rawText.substring(lastClose + 1);
                textPart = (beforeJSON + "\n" + afterJSON).replace(/```json|```/g, "").trim();
            } else {
                 // 没找到 JSON，整段都是文字
                 textPart = rawText.replace(/```json|```/g, "").trim();
            }
            
            let parsedData = {};
            try {
                if (jsonPart) {
                    parsedData = JSON.parse(jsonPart);
                }
            } catch (e) {
                console.error("JSON Parse Error", e);
                // JSON 解析失败，视为无结构化数据
                parsedData = {
                    grade: "解析异常",
                    summary: "回复格式不正确",
                    logic: "",
                    matches: []
                };
            }

            // 合并结果: JSON数据 + 额外解释文字
            // 如果 JSON 中没有 logic，或者 parsing 失败，则把 textPart 当做 logic
            const finalResult = {
                grade: parsedData.grade || "评估结果",
                summary: parsedData.summary || "",
                logic: parsedData.logic || "",
                matches: parsedData.matches || [],
                explanation: textPart // 新增字段：用于存放 AI 的废话/解释/拒识理由
            };
            
            // 兜底逻辑：如果 AI 只说了话没给 JSON，把话放进 logic 里显示，避免空白
            if (!finalResult.logic && finalResult.explanation) {
                finalResult.logic = finalResult.explanation;
                finalResult.explanation = ""; // 避免重复显示
            }

            return finalResult;
        }

        // --- 子组件: 标准库 ---

        function StandardsView() {
            const [searchTerm, setSearchTerm] = useState('');
            
            const filteredStandards = STANDARD_DB.map(cat => ({
                ...cat,
                items: cat.items.filter(item => 
                item.desc.includes(searchTerm) || cat.category.includes(searchTerm) || item.grade.includes(searchTerm)
                )
            })).filter(cat => cat.items.length > 0);

            return (
                <div className="p-4">
                <div className="sticky top-0 z-10 bg-slate-50 pb-4">
                    <div className="relative shadow-sm rounded-xl">
                    <Search className="absolute left-3 top-3 text-slate-400" size={18} />
                    <input 
                        type="text" 
                        placeholder="搜索标准（如：骨折、缺失、眼...）"
                        value={searchTerm}
                        onChange={(e) => setSearchTerm(e.target.value)}
                        className="w-full bg-white pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm"
                    />
                    </div>
                </div>

                <div className="space-y-4">
                    {filteredStandards.length > 0 ? (
                    filteredStandards.map((cat, idx) => (
                        <div key={idx} className="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
                        <div className="bg-emerald-50/50 px-4 py-3 font-bold text-emerald-800 text-sm flex justify-between items-center border-b border-emerald-50">
                            {cat.category}
                            <ChevronRight size={14} className="text-emerald-300"/>
                        </div>
                        <div className="divide-y divide-slate-50">
                            {cat.items.map((item, i) => (
                            <div key={i} className="p-4 hover:bg-slate-50 transition-colors">
                                <div className="flex items-start gap-3">
                                <span className="shrink-0 text-[10px] px-2 py-1 rounded-md font-bold mt-0.5 bg-emerald-100 text-emerald-700">
                                    {item.grade}
                                </span>
                                <p className="text-sm text-slate-600 whitespace-pre-wrap leading-relaxed">{item.desc}</p>
                                </div>
                            </div>
                            ))}
                        </div>
                        </div>
                    ))
                    ) : (
                    <div className="text-center py-20 text-slate-400">
                        <BookOpen size={48} className="mx-auto mb-4 opacity-20" />
                        <p>未找到相关条款</p>
                    </div>
                    )}
                </div>
                </div>
            );
        }

        // --- 子组件: 历史记录 (功能版) ---

        function HistoryView({ history, onClear }) {
            return (
                <div className="p-4">
                <div className="flex justify-between items-center mb-4 px-1">
                    <h2 className="text-lg font-bold text-slate-800">历史鉴定记录</h2>
                    {history.length > 0 && (
                    <button 
                        onClick={onClear}
                        className="text-xs flex items-center gap-1 text-slate-400 hover:text-red-500 transition-colors"
                    >
                        <Trash2 size={12} /> 清空
                    </button>
                    )}
                </div>
                
                <div className="space-y-3">
                    {history.length === 0 ? (
                    <div className="flex flex-col items-center justify-center py-20 opacity-50">
                        <FileText size={48} className="text-slate-300 mb-2" />
                        <p className="text-sm text-slate-400">暂无历史记录</p>
                    </div>
                    ) : (
                    history.map((item) => (
                        <div key={item.id} className="bg-white p-4 rounded-xl border border-slate-100 shadow-sm hover:shadow-md transition-shadow">
                        <div className="flex justify-between items-start mb-2">
                            <span className="text-xs text-slate-400 bg-slate-50 px-2 py-1 rounded">{item.date}</span>
                            <span className="text-sm font-bold text-emerald-600">{item.grade}</span>
                        </div>
                        <h4 className="font-medium text-slate-700 text-sm mb-1 line-clamp-1">{item.summary || "无摘要"}</h4>
                        <p className="text-xs text-slate-500 line-clamp-2">{item.input}</p>
                        </div>
                    ))
                    )}
                </div>

                <div className="mt-8 p-4 bg-blue-50 rounded-xl border border-blue-100 flex gap-3">
                    <div className="bg-blue-100 p-2 rounded-lg h-fit text-blue-600 shrink-0">
                    <AlertCircle size={20} />
                    </div>
                    <div>
                    <h4 className="text-sm font-bold text-blue-800 mb-1">隐私说明</h4>
                    <p className="text-xs text-blue-700 leading-relaxed">
                        所有历史记录仅保存在您当前浏览器的本地缓存中，不会上传至服务器。清除浏览器缓存将导致记录丢失。
                    </p>
                    </div>
                </div>
                </div>
            );
        }

        // --- 辅助组件 ---

        function NavButton({ icon, label, active, onClick, activeColor }) {
            return (
                <button 
                onClick={onClick}
                className={`flex flex-col items-center gap-1 w-16 transition-all duration-300 ${active ? activeColor : 'text-slate-400 hover:text-slate-500'}`}
                >
                <div className={`transition-transform duration-300 ${active ? 'scale-110 -translate-y-1' : ''}`}>
                    {icon}
                </div>
                <span className="text-[10px] font-medium">{label}</span>
                </button>
            );
        }

        // --- 渲染逻辑 ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SmartDisabilityAssessment />);
    </script>
</body>
</html>
